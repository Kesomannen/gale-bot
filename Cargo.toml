[package]
name = "gale-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["json"] }
figment = { version = "0.10", features = ["toml", "env"] }
dotenvy = "0.15.7"
hex = "0.4.3"
hmac = "0.13.0"
insta = "1.48.0"
jiff = { version = "0.2.35", features = ["serde"] }
octocrab = "0.54.1"
poise = "0.6.2"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
