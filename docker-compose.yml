services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - ${GALE_BOT_PORT:-8080}:8080
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - RUST_LOG=info,gale_bot=debug
    volumes:
      - ./gale-bot-production.toml:/etc/gale-bot/config.toml:ro
